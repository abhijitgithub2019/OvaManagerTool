# ─────────────────────────────────────────────────────────────────────────────
# nginx TLS reverse proxy for the VMM Launcher (OVA Build Manager)
#
# Purpose (Phase 1 hardening):
#   - Terminate HTTPS/WSS here so the Juniper lab password is encrypted on the wire.
#   - Proxy to gunicorn bound on 127.0.0.1:8085 (never exposed directly).
#   - Upgrade WebSocket connections (Socket.IO) correctly.
#
# Install on q-jrd-vm-launcher (Ubuntu):
#   sudo cp deploy/nginx-vmm-launcher.conf /etc/nginx/sites-available/vmm-launcher
#   sudo ln -s /etc/nginx/sites-available/vmm-launcher /etc/nginx/sites-enabled/vmm-launcher
#   sudo rm -f /etc/nginx/sites-enabled/default        # optional: drop default site
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Set the Connection header for proxying based on whether the client actually
# requested a protocol upgrade (WebSocket). For normal HTTP requests $http_upgrade
# is empty, so Connection becomes "close" and the response completes normally.
# Hardcoding Connection "upgrade" on every request makes nginx hang waiting for a
# WebSocket handshake that never happens (e.g. POST /api/check-capacity stalls).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name q-jrd-vm-launcher.englab.juniper.net 10.54.231.11;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name q-jrd-vm-launcher.englab.juniper.net 10.54.231.11;

    # ── TLS certificate ──────────────────────────────────────────────────────
    # Use a cert from your internal CA. For a quick self-signed cert (lab only):
    #   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/vmm-launcher.key \
    #     -out    /etc/ssl/certs/vmm-launcher.crt \
    #     -subj "/CN=q-jrd-vm-launcher.englab.juniper.net"
    ssl_certificate     /etc/ssl/certs/vmm-launcher.crt;
    ssl_certificate_key /etc/ssl/private/vmm-launcher.key;

    # ── Modern TLS settings ──────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Long deployments stream logs over the socket; keep connections alive.
    proxy_read_timeout  7200s;
    proxy_send_timeout  7200s;

    # ── Friendly error page when the app is down/unreachable ─────────────────
    # Install the page once:
    #   sudo mkdir -p /var/www/vmm-launcher
    #   sudo cp deploy/maintenance.html /var/www/vmm-launcher/maintenance.html
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/vmm-launcher;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        # WebSocket / Socket.IO upgrade (only when the client requests it)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Preserve client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}
